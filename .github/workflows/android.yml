name: Android APK

# APK собирается в облаке: локально нужны только Node.js и Git.
# JDK и Android SDK ставит себе раннер (JDK 21 — требует Capacitor 8 / AGP 8.13).
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Собрать debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Код проекта
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Именно 21: Gradle 8.14.3 не работает на JDK 25, а AGP 8.13 — с Gradle 9.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Gradle (кэш зависимостей)
        uses: gradle/actions/setup-gradle@v4

      - name: Зависимости npm
        run: npm ci

      - name: Сборка веб-части
        run: npm run build

      - name: Синхронизация с Android-проектом
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить, что APK на месте
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Отдать APK файлом
        uses: actions/upload-artifact@v4
        with:
          name: kassa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Публикация APK по тегу
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрать APK из сборки
        uses: actions/download-artifact@v4
        with:
          name: kassa-android-debug
          path: release

      - name: Опубликовать в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/app-debug.apk
          generate_release_notes: true
